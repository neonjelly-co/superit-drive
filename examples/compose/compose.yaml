# A worked example: Superit Drive on one server, behind Caddy (the reverse proxy) and Authelia (the sign-in), with a
# member list file. docs/operations.md in this repository walks through it, under "A worked example".
#
#   cp example.env .env        then set DRIVE_VERSION in .env
#   docker compose up -d
#   open https://drive.example.localhost and sign in as reka, password example-password-reka
#
# Every password and secret here is an example: replace them all before real use.
name: superit-drive-example

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DRIVE_HEADER_SECRET: ${DRIVE_HEADER_SECRET:?set DRIVE_HEADER_SECRET in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [authelia, drive]

  authelia:
    image: authelia/authelia:4.39.28
    restart: unless-stopped
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?set AUTHELIA_SESSION_SECRET in .env}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?set AUTHELIA_STORAGE_ENCRYPTION_KEY in .env}
    volumes:
      - ./authelia:/config
      - authelia-data:/data

  drive:
    image: ghcr.io/neonjelly-co/superit-drive:${DRIVE_VERSION:?set DRIVE_VERSION in .env}
    restart: unless-stopped
    # Time to stop in: the Drive ends what is under way, then writes how often links were used and a last copy of its
    # index. Docker's own ten seconds can be over before that.
    stop_grace_period: 40s
    # No ports: only Caddy reaches the Drive, over the network compose makes for this example.
    environment:
      DRIVE_ADDRESS: https://drive.example.localhost
      DRIVE_PROJECT_NAME: ${DRIVE_PROJECT_NAME:?set DRIVE_PROJECT_NAME in .env}
      DRIVE_HEADER_SECRET: ${DRIVE_HEADER_SECRET:?set DRIVE_HEADER_SECRET in .env}
      DRIVE_MEMBERS_FILE: /members/members.json
      DRIVE_STORAGE_URL: ${DRIVE_STORAGE_URL:?set DRIVE_STORAGE_URL in .env}
      DRIVE_STORAGE_USER: ${DRIVE_STORAGE_USER:?set DRIVE_STORAGE_USER in .env}
      DRIVE_STORAGE_PASSWORD: ${DRIVE_STORAGE_PASSWORD:?set DRIVE_STORAGE_PASSWORD in .env}
      DRIVE_STORAGE_FOLDER: ${DRIVE_STORAGE_FOLDER:-/}
      DRIVE_CAPACITY: ${DRIVE_CAPACITY:-}
      # The mail server for "shared with you" mail; all empty: no mail.
      DRIVE_SMTP_HOST: ${DRIVE_SMTP_HOST:-}
      DRIVE_SMTP_PORT: ${DRIVE_SMTP_PORT:-}
      DRIVE_SMTP_TLS: ${DRIVE_SMTP_TLS:-}
      DRIVE_SMTP_USER: ${DRIVE_SMTP_USER:-}
      DRIVE_SMTP_PASSWORD: ${DRIVE_SMTP_PASSWORD:-}
      DRIVE_MAIL_FROM: ${DRIVE_MAIL_FROM:-}
    volumes:
      # The folder holding the member list, not the file: a file mount would not see the file replaced.
      - ./members:/members:ro
      - drive-data:/data
    depends_on: [storage]

  # A stand-in WebDAV server so that the example runs as it is: Apache with mod_dav, from this repository's tests,
  # with the example login drive / drive-test-password. For real use, delete this service (and the Drive's
  # depends_on), and set DRIVE_STORAGE_* in .env to your own WebDAV server.
  storage:
    build: ../../test/webdav

volumes:
  caddy-data:
  caddy-config:
  authelia-data:
  drive-data:

# One WebDAV tree at the root of the address, behind Basic auth (user "drive", password "drive-test-password").
DocumentRoot "/var/storage/files"
DavLockDB "/var/storage/lock/DavLock"
LimitRequestBody 0

<Directory "/var/storage/files">
    Dav On
    DavDepthInfinity Off
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "Drive storage"
    AuthBasicProvider file
    AuthUserFile "conf/storage.passwd"
    Require valid-user
</Directory>

# Folders that behave like a WebDAV server lacking one thing the Drive needs, for the tests of the storage check
# (`superit-drive check-storage`). Each refuses or ignores one thing everywhere under it; the login is still required
# (AuthMerging And), and the rest of the tree is unaffected.
<Directory "/var/storage/files/refuses-mkcol">
    AuthMerging And
    <Limit MKCOL>
        Require all denied
    </Limit>
</Directory>
<Directory "/var/storage/files/refuses-put">
    AuthMerging And
    <Limit PUT>
        Require all denied
    </Limit>
</Directory>
<Directory "/var/storage/files/ignores-range">
    # Answers a request for part of a file with the whole file.
    MaxRanges none
</Directory>
<Directory "/var/storage/files/refuses-move">
    AuthMerging And
    <Limit MOVE>
        Require all denied
    </Limit>
</Directory>
<Directory "/var/storage/files/refuses-delete">
    AuthMerging And
    <Limit DELETE>
        Require all denied
    </Limit>
</Directory>
<Directory "/var/storage/files/refuses-content-range">
    # Refuses a write to part of a file.
    AuthMerging And
    <If "-n req('Content-Range')">
        Require all denied
    </If>
</Directory>
<Directory "/var/storage/files/ignores-content-range">
    # Takes a write to part of a file as a new whole file, as RFC 9110 warns some servers do.
    RequestHeader unset Content-Range
</Directory>
